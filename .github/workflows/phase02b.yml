name: Phase 02B real CPU forecasting gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-foundation-and-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forewise_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: forewise_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U forewise_ci -d forewise_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://forewise_ci:local-ci-only@127.0.0.1:5432/forewise_ci
      TEST_DATABASE_URL: postgresql://forewise_ci:local-ci-only@127.0.0.1:5432/forewise_ci
      FORECAST_SERVICE_TOKEN: local-ci-only-internal-service-token-123456
      RUN_TIMESTRAL_INTEGRATION: '1'
      FOREWISE_MODEL_DEVICE: cpu
      # Chrome stable has Ubuntu's supported AppArmor profile. Keep its sandbox enabled.
      CHROME_PATH: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install uv==0.12.2
          uv venv --seed .venv
          uv pip install --python .venv/bin/python torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -r services/forecast/requirements.lock.txt
          npm ci
          npx playwright install --with-deps chromium
      - run: node --import tsx scripts/database.mjs
      - name: Verify supported Chrome installation
        run: |
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
      - run: npm run verify
      - name: Phase 03A real-model CPU quality smoke test
        run: .venv/bin/python scripts/benchmark-quality.py --device cpu --only bike_daily --horizons 1 --output .data/phase03a-ci-smoke.json
      - name: Start local application
        run: |
          python scripts/dev.py --production > /tmp/forewise-ci.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      - name: Functional/security/real-model browser suite
        # Hallmark audits public/auth routes; protected workspace rendering remains in Playwright.
        run: npx playwright test --grep-invert 'public design / accessibility / snapshots|workspace design / values / accessibility'
      - name: Hallmark local rendered audit
        run: npm run design:render
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase02b-cpu-validation
          path: |
            docs/phase-02b/evidence/
            .data/checks/results.json
            .data/phase03a-ci-smoke.json
            .data/checks/*.log
            .data/hallmark/render-results.json
            .data/hallmark/render-*/
          include-hidden-files: true
          retention-days: 14
